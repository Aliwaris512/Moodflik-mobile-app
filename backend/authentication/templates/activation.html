{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moodflik Activation</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #090909;
        --card-bg: rgba(16, 16, 16, 0.9);
        --text: #f2f2f2;
        --subtle: #cccccc;
        --accent: #2bb673;
        --accent-dark: #1d7f4f;
        --error: #ff6b6b;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        --border-radius: 20px;
        font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
        line-height: 1.55;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: linear-gradient(135deg, #f5f3ff, #f1f8ff);
          --card-bg: rgba(255, 255, 255, 0.92);
          --text: #1b1b1f;
          --subtle: #444;
          --accent: #2bb673;
          --accent-dark: #1f8857;
          --error: #d64545;
          --shadow: 0 18px 42px rgba(14, 30, 37, 0.18);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        background-attachment: fixed;
      }

      .card {
        width: min(620px, 100%);
        border-radius: var(--border-radius);
        padding: clamp(24px, 5vw, 44px);
        background: var(--card-bg);
        color: var(--text);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 600;
        background: linear-gradient(135deg, #2bb673, #3de0a2);
        color: #fff;
      }

      h1 {
        font-size: clamp(26px, 5vw, 34px);
        margin-bottom: 16px;
      }

      p {
        margin-bottom: 24px;
        color: var(--subtle);
        font-size: 17px;
      }

      .badged-text {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(43, 182, 115, 0.18);
        color: var(--accent);
        font-weight: 600;
        margin: 0 auto 24px;
      }

      .badged-text.error {
        background: rgba(255, 107, 107, 0.16);
        color: var(--error);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 24px 0 12px;
      }

      a.button {
        padding: 14px 20px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 16px;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      .primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 12px 24px rgba(43, 182, 115, 0.32);
      }

      .primary:hover,
      .primary:focus {
        background: var(--accent-dark);
        transform: translateY(-1px);
        box-shadow: 0 16px 32px rgba(43, 182, 115, 0.38);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      footer {
        font-size: 15px;
        color: var(--subtle);
        margin-top: 24px;
      }

      footer a {
        color: inherit;
      }

      .store-links {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
        }
        .card {
          padding: 24px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="logo" aria-hidden="true">MF</div>
      <div id="status-badge" class="badged-text">Activating your account…</div>
      <h1 id="title">Hang tight</h1>
      <p id="message">We are validating your activation link. This usually takes just a second.</p>
      <div class="actions" id="actions">
        <a
          id="open-app"
          class="button primary hidden"
          href="app://moodflik.com/activate"
          rel="noopener"
        >
          Open Moodflik App
        </a>
        <div class="store-links">
          <a id="ios-store" class="button secondary hidden" href="{{ app_ios_url }}" rel="noopener">
            Download on the App Store
          </a>
          <a
            id="android-store"
            class="button secondary hidden"
            href="{{ app_android_url }}"
            rel="noopener"
          >
            Get it on Google Play
          </a>
        </div>
      </div>
      <footer>
        Need help? Email
        <a href="mailto:{{ support_email }}">{{ support_email }}</a>.
      </footer>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const status = (params.get('status') || 'success').toLowerCase();
        const reason = (params.get('reason') || '').toLowerCase();
        const badge = document.getElementById('status-badge');
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const openButton = document.getElementById('open-app');
        const iosButton = document.getElementById('ios-store');
        const androidButton = document.getElementById('android-store');

        const ua = window.navigator.userAgent || '';
        const isAndroid = /android/i.test(ua);
        const isIOS = /\b(iPhone|iPad|iPod)\b/i.test(ua);

        const COPY = {
          success: {
            badge: 'Activation successful',
            title: 'You’re all set!',
            message:
              'Your Moodflik account is now active. Jump back into the app to start sharing the highs and lows.',
            showOpen: true,
          },
          already_activated: {
            badge: 'Account recognised',
            title: 'Already activated',
            message:
              'Looks like your Moodflik account was already activated. You can sign in right away.',
            showOpen: true,
          },
          failed_invalid_token: {
            badge: 'Activation link issue',
            title: 'Link expired or invalid',
            message:
              'This activation link has already been used or is no longer valid. Request a fresh one from the Moodflik app or contact support if you need help.',
            error: true,
          },
          failed_server_error: {
            badge: 'Something went wrong',
            title: 'We couldn’t finish activation',
            message:
              'Our servers had a hiccup while trying to activate your account. Please try again in a moment or reach out to the support team.',
            error: true,
          },
          failed: {
            badge: 'Activation issue',
            title: 'Activation unavailable',
            message:
              'We couldn’t activate your account with this link. Please request a new email or contact support.',
            error: true,
          },
        };

        const key =
          status === 'failed' && reason
            ? `failed_${reason}`
            : Object.prototype.hasOwnProperty.call(COPY, status)
              ? status
              : 'failed';
        const content = COPY[key] || COPY.failed;

        badge.textContent = content.badge;
        title.textContent = content.title;
        message.textContent = content.message;

        if (content.error) {
          badge.classList.add('error');
        } else {
          badge.classList.remove('error');
        }

        if (content.showOpen && (isAndroid || isIOS)) {
          openButton.classList.remove('hidden');
          openButton.href = 'app://moodflik.com/activation-success';
        }

        if (isIOS) {
          iosButton.classList.remove('hidden');
        } else if (isAndroid) {
          androidButton.classList.remove('hidden');
        } else {
          iosButton.classList.remove('hidden');
          androidButton.classList.remove('hidden');
        }
      })();
    </script>
  </body>
</html>
